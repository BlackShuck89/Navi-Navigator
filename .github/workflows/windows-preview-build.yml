name: Build Navi Navigator Windows prototype

on:
  push:
    branches: [main]
    paths:
      - 'prototype/NaviNavigator/**'
      - '.github/workflows/windows-preview-build.yml'
  pull_request:
    paths:
      - 'prototype/NaviNavigator/**'
      - '.github/workflows/windows-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and compile standalone Windows executable
        shell: pwsh
        run: |
          dotnet restore prototype/NaviNavigator/NaviNavigator.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed' }
          dotnet publish prototype/NaviNavigator/NaviNavigator.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (!(Test-Path artifacts/publish/NaviNavigator.exe)) {
            throw 'Compiled executable not found'
          }
          Get-ChildItem artifacts/publish | Select-Object Name, Length | Format-Table

      - name: Verify shipped appearance packages
        shell: pwsh
        run: |
          $expected = @('modern', 'classic', 'fusion')
          foreach ($skin in $expected) {
            $manifestPath = "artifacts/publish/Skins/$skin/skin.json"
            if (!(Test-Path -LiteralPath $manifestPath)) { throw "Missing skin: $skin" }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.Id -ne $skin -or $manifest.SchemaVersion -ne 1) {
              throw "Invalid skin manifest: $skin"
            }
          }
          $assets = @('navi-character.svg', 'navi-compass.svg')
          foreach ($asset in $assets) {
            $path = "artifacts/publish/Assets/$asset"
            if (!(Test-Path $path)) { throw "Missing Navi branding asset: $asset" }
            [xml]$svg = Get-Content -LiteralPath $path -Raw
            if ($svg.DocumentElement.LocalName -ne 'svg') { throw "Invalid SVG: $asset" }
            if ($svg.OuterXml -match '(?i)Netscape|Mozilla|Firefox') {
              throw "Found legacy logo/brand label in $asset"
            }
          }
          $portal = Get-Content -LiteralPath prototype/NaviNavigator/NaviPortal.cs -Raw
          if ($portal -notmatch 'BuildAboutHtml' -or $portal -notmatch 'navi-compass.svg') {
            throw 'Missing branded About page or portal emblem integration'
          }
          if (!(Test-Path artifacts/publish/Assets/navi-approved-hero.webp)) {
            Write-Warning "Approved Navi hero WebP is not in Git source; this Actions artifact uses the legacy fallback. Include it before shipping to testers."
          }
          Write-Host 'Navi skin manifests, compass, and About markup validated.'

      - name: Package portable test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item prototype/NaviNavigator/README.md artifacts/publish/README-FIRST.txt
          Compress-Archive -Path artifacts/publish/* `
            -DestinationPath dist/NaviNavigator-0.0.4-Windows-x64-TechnicalPreview.zip `
            -CompressionLevel Optimal
          if (!(Test-Path dist/NaviNavigator-0.0.4-Windows-x64-TechnicalPreview.zip)) {
            throw 'Failed to create zip'
          }

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviNavigator-0.0.4-Windows-x64-TechnicalPreview
          path: dist/NaviNavigator-0.0.4-Windows-x64-TechnicalPreview.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publication note
        shell: pwsh
        run: |
          Write-Host "0.0.4 is an artifact-only build until the approved Navi hero binary has been bundled."
          Write-Host "Use the fully assembled test ZIP, not the raw Actions artifact, for visual review."
