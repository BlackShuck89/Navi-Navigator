name: Build Navi Navigator Windows prototype

on:
  push:
    branches: [main]
    paths:
      - 'prototype/NaviNavigator/**'
      - '.github/workflows/windows-preview-build.yml'
  pull_request:
    paths:
      - 'prototype/NaviNavigator/**'
      - '.github/workflows/windows-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and compile standalone Windows executable
        shell: pwsh
        run: |
          dotnet restore prototype/NaviNavigator/NaviNavigator.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed' }
          dotnet publish prototype/NaviNavigator/NaviNavigator.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (!(Test-Path artifacts/publish/NaviNavigator.exe)) {
            throw 'Compiled executable not found'
          }
          Get-ChildItem artifacts/publish | Select-Object Name, Length | Format-Table

      - name: Verify shipped appearance packages
        shell: pwsh
        run: |
          $expected = @('modern', 'classic', 'fusion')
          foreach ($skin in $expected) {
            $manifestPath = "artifacts/publish/Skins/$skin/skin.json"
            if (!(Test-Path -LiteralPath $manifestPath)) { throw "Missing skin: $skin" }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.Id -ne $skin -or $manifest.SchemaVersion -ne 1) {
              throw "Invalid skin manifest: $skin"
            }
          }
          if (!(Test-Path artifacts/publish/Assets/navi-character.svg)) {
            throw "Missing Navi portal character artwork"
          }

      - name: Package portable test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item prototype/NaviNavigator/README.md artifacts/publish/README-FIRST.txt
          Compress-Archive -Path artifacts/publish/* `
            -DestinationPath dist/NaviNavigator-0.0.2-Windows-x64-TechnicalPreview.zip `
            -CompressionLevel Optimal
          if (!(Test-Path dist/NaviNavigator-0.0.2-Windows-x64-TechnicalPreview.zip)) {
            throw 'Failed to create zip'
          }

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviNavigator-0.0.2-Windows-x64-TechnicalPreview
          path: dist/NaviNavigator-0.0.2-Windows-x64-TechnicalPreview.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub prerelease after successful compile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.0.2-preview.1"
          $zip = "dist/NaviNavigator-0.0.2-Windows-x64-TechnicalPreview.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $zip `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Navi Navigator 0.0.2 — Windows technical preview" `
              --notes-file prototype/NaviNavigator/RELEASE_NOTES.md `
              --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
